method: singleturn_listwise
system_message: >
  Rank passages by relevance to the query. Prefer direct, precise answers.
  Ignore length or style unless they reduce clarity.
  Output the ranking as a chain of bracketed passage IDs separated by " > ",
  from most relevant to least relevant. Example output: [3] > [1] > [5] > [2] > [4]
  Do not add commentary, explanations, or JSON.
prefix: |
  {context}For the query [querystart] {query} [queryend], rank the passages from most to
  least relevant. Focus on whether each passage actually helps answer the query.
body: |
  [{rank}] {candidate}
suffix: "Given the query [querystart] {query} [queryend], output the ranking as a chain of bracketed passage IDs separated by \" > \". Example: [3] > [1] > [5] > [2] > [4]. Include every passage ID exactly once. No JSON, no commentary."
output_validation_regex: "^\\[rankstart\\] \\[\\d+\\]( > \\[\\d+\\])* \\[rankend\\]$"
output_extraction_regex: "\\[(\\d+)\\]"
