name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint
        run: uv run --with ruff --no-sync ruff check src
      - name: Format check
        run: uv run --with ruff --no-sync ruff format --check src

  smoke:
    name: Import and CLI smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --python ${{ matrix.python-version }}
      - name: Import smoke
        run: uv run python -c "import kindly_web_search_mcp_server.server; import kindly_web_search_mcp_server.cli.app; print('imports OK')"
      - name: CLI smoke
        run: uv run web-search-cli --help
