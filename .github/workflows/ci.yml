name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Lint
        run: uv run --with ruff --no-sync ruff check src tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --extra eval --group dev --python ${{ matrix.python-version }}
      - name: Lint
        run: uv run ruff check src tests
      - name: Import smoke
        run: uv run python -c "import kindly_web_search_mcp_server.server; import kindly_web_search_mcp_server.cli.app; print('imports OK')"
      - name: Test
        run: uv run pytest -q --tb=short
      - name: Check for leaked test artifacts
        run: |
          if ls test_*.duckdb >/dev/null 2>&1; then
            echo "::error::test_*.duckdb leaked into repo root (cwd sandbox not effective)"
            exit 1
          fi
          echo "no leaked test artifacts"
