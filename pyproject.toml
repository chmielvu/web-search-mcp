[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-search-mcp"
version = "0.1.8"
description = "MCP server: Multi-provider web search with RRF merge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.3,<4",  # v4 is beta (v4.0.0b3); pin to 3.x until stable; 3.4.3+ fixes caching middleware TypeError
    "pydocket>=0.20.0",  # SEP-1686 background tasks (fastmcp[tasks])
    "exa-py>=2.18.1,<3",
    "mcp>=1.27.0,<2",
    "aiofiles>=24.1.0",
    "pydantic",
    "httpx",
    "beautifulsoup4",
    "composio",
    "markdownify",
    "markitdown[docx,pptx,xlsx,xls]>=0.1.7",
    "striprtf>=0.0.33",
    "defusedxml>=0.7.1",
    "PyMuPDF",
    "duckdb>=1.1.0,<1.5.3",
    "firecrawl-py>=4.32.1,<5",
    "qdrant-client>=1.7.0",
    "protobuf>=6.33.6",
    "pyarrow>=18.0.0",
    "numpy>=1.26.0",
    "bm25s>=0.3.2,<0.4",
    "yake>=0.4.8",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "openai>=2.36.0",
    "huggingface-hub>=0.28.0",
    "youtube-transcript-api>=0.6.0",
    "yt-dlp>=2024.0.0",
    "ftfy>=6.2.0",
    "ddgs>=7.0.0",
    "parallel-web>=1.0",
    "arxiv>=3.0.0",
    "pyalex>=0.13",  # OpenAlex SDK (250M+ works)
    "habanero>=1.0.0",  # CrossRef SDK
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "structlog>=24.0.0",
    "openinference-instrumentation-openai",
    "prefab-ui>=0.20.2",
    "typer>=0.16.0",
    "judges>=0.1.1",  # LLM-as-Judge evaluators (ReliableCIRelevance, etc.)
    "pyyaml>=6.0.1",
    "rank-llm[cloud] @ git+https://github.com/castorini/rank_llm.git@54fb0c055cd1692ac75ae44cd48e1933155f99dd",
    "telethon>=1.44.0",
    "tree-sitter-language-pack>=1.14,<2",
    "wordninja>=2.0.0",
    "lingua-language-detector>=2.2.0",
]

[project.optional-dependencies]
eval = ["mcpevals"]
pdf-advanced = [
    "pymupdf-layout>=1.26.6; python_version < '3.14'",
    "pymupdf4llm>=0.2.7; python_version < '3.14'",
]

[project.scripts]
mcp-server = "kindly_web_search_mcp_server.server:main"
mcp-web-search = "kindly_web_search_mcp_server.server:main"
web-search-mcp = "kindly_web_search_mcp_server.server:main"
web-search-cli = "kindly_web_search_mcp_server.cli.app:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kindly_web_search_mcp_server"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".uv-cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

"src/kindly_web_search_mcp_server/analytics/app.py" = ["E402"]
"tests/test_shadow_runner.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest.*",
]

[tool.pyright]
include = ["src"]
exclude = [
    ".venv",
    "**/__pycache__",
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
