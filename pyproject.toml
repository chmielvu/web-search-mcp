[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-search-mcp"
version = "0.1.8"
description = "MCP server: Multi-provider web search with RRF merge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.3,<4",  # v4 is beta (v4.0.0b3); pin to 3.x until stable; 3.4.3+ fixes caching middleware TypeError
    "pydocket>=0.20.0",  # SEP-1686 background tasks (fastmcp[tasks])
    "exa-py>=2.18.1,<3",
    "mcp>=1.27.0,<2",
    "aiofiles>=24.1.0",
    "pydantic",
    "httpx",
    "beautifulsoup4",
    "composio",
    "markdownify",
    "turbohtml>=1.8,<2",  # C-accelerated WHATWG DOM parse + main-content scoring for dom_detector
    "markitdown[docx,pptx,xlsx,xls]>=0.1.7",
    "striprtf>=0.0.33",
    "defusedxml>=0.7.1",
    "PyMuPDF",
    "duckdb>=1.1.0,<1.5.3",
    "qdrant-client>=1.7.0",
    "protobuf>=6.33.6",
    "pyarrow>=18.0.0",
    "numpy>=1.26.0",
    "bm25s>=0.3.2,<0.4",
    "yake>=0.4.8",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "openai>=2.36.0",
    "voyageai>=0.5.0,<1",
    "huggingface-hub>=0.28.0",
    "youtube-transcript-api>=0.6.0",
    "yt-dlp>=2024.0.0",
    "ftfy>=6.2.0",
    "ddgs>=9.14,<10",
    "parallel-web>=1.0",
    "arxiv>=3.0.0",
    "pyalex>=0.13",  # OpenAlex SDK (250M+ works)
    "habanero>=1.0.0",  # CrossRef SDK
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "openinference-instrumentation-openai",
    "prefab-ui>=0.20.2",
    "typer>=0.16.0",
    "pyyaml>=6.0.1",
    "rank-llm[cloud] @ git+https://github.com/castorini/rank_llm.git@54fb0c055cd1692ac75ae44cd48e1933155f99dd",
    "telethon>=1.44.0",
    "markdown-it-py>=4.0.0,<5",
    "mdit-py-plugins>=0.5.0",
    "linkify-it-py>=1,<3",
    "mdformat>=1.0.0,<2",
    "chonkie>=1.7,<2",
    "mdformat-gfm>=1.0.0,<2",
    "rumdl>=0.2.73,<1",
    "wordsegment>=1.3.1,<2",
    "lingua-language-detector>=2.2.0",
    "networkx>=3.5,<4",
]

[project.optional-dependencies]
pdf-advanced = [
    "pymupdf-layout>=1.26.6; python_version < '3.14'",
    "pymupdf4llm>=0.2.7; python_version < '3.14'",
]

[project.scripts]
mcp-server = "kindly_web_search_mcp_server.server:main"
mcp-web-search = "kindly_web_search_mcp_server.server:main"
web-search-mcp = "kindly_web_search_mcp_server.server:main"
web-search-cli = "kindly_web_search_mcp_server.cli.app:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kindly_web_search_mcp_server"]

[tool.hatch.build.targets.wheel.sources]
src = ""

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0",
    "ty>=0.0.81",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".uv-cache",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",  # line length is the formatter's job
    # FastMCP resolves parameters from their default annotations, and Typer uses
    # default values for options — a call in a default declares a dependency here,
    # it is not the shadowing accident B008 exists to catch.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

"src/kindly_web_search_mcp_server/analytics/app.py" = ["E402"]

# The module documents the typographic characters it normalizes, so the character
# names in those comments are the subject of the comment, not accidental lookalikes.
"src/kindly_web_search_mcp_server/utils/text_clean.py" = ["RUF003"]

# Typer collects repeated options into the default list object, which is the
# documented way to declare a multi-value option.
"src/kindly_web_search_mcp_server/cli/commands/search.py" = ["B006"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:pytest.*",
]

[tool.ty]
# Type checking: ty is the checker that CI runs. See AGENTS.md → "Type checking".

[tool.ty.environment]
python = ".venv"
python-version = "3.12"
root = ["./src"]

[tool.ty.analysis]
# Modules that are optional at runtime — installed by hand or by an optional
# extra, never by `uv sync`. Every other unresolved import is a real error.
allowed-unresolved-imports = [
    "curl_cffi.**",  # TLS-impersonating HTTP client (stealth fetch tier)
    "fitz",  # legacy module name for PyMuPDF
    "gradio_client.**",  # Hugging Face Space ASR tier
    "pymupdf.layout",  # pdf-advanced extra
    "pymupdf4llm",  # pdf-advanced extra
    "opentelemetry.exporter.prometheus",  # optional OTEL exporter
]

[tool.pyright]
include = ["src"]
exclude = [
    ".venv",
    "**/__pycache__",
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = "warning"
reportMissingModuleSource = "warning"
