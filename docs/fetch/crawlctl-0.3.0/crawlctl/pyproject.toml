[project]
name = "crawlctl"
version = "0.3.0"
description = "FastMCP server exposing a self-hosted Crawl4AI instance to AI agents: scrape -> clean -> RAG-ready Markdown documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crawlctl" }]
keywords = ["crawl4ai", "mcp", "rag", "markdown", "scraping", "fastmcp"]
dependencies = [
  "fastmcp>=2.10",
  "httpx>=0.27",
  "markdown-it-py>=3.0",
  "linkify-it-py>=2.0",
  "pyyaml>=6.0",
  "ftfy>=6.1",
]

[project.optional-dependencies]
# Chonkie MarkdownChef backend (structural parse spans). MarkdownChef is a
# parser, not a cleaner; crawlctl uses it for structure-aware masking.
chef = ["chonkie>=1.3.1"]
# Extraction arbitration candidate from cleaned_html
trafilatura = ["trafilatura>=1.12"]
# Exact token counts in front matter (else chars/3.8 estimate)
tiktoken = ["tiktoken>=0.7"]
# Optional final idempotent formatter pass (off by default)
polish = ["mdformat>=0.7", "mdformat-gfm>=0.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
crawl4ai-rag-mcp = "crawlctl.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawlctl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
